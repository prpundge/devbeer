<svg width="13" height="13" viewBox="0 0 13 13" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    The DevBeer mark at 0.8 scale, plus a sparkle for "AI".

    Previously a plain speech bubble, which carried no brand at all — the tool-window stripe
    showed a generic chat glyph next to the words "DevBeer AI". The glass is the same geometry
    as devbeer13.svg and pluginIcon.svg, just scaled to leave room for the sparkle.
  -->
  <g stroke="#6E6E6E" stroke-width="1.05" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- handle -->
    <path d="M6.5 6.8h0.72a1.2 1.2 0 0 1 0 2.48H6.5"/>
    <!-- glass -->
    <path d="M0.9 5.2v4.88a0.92 0.92 0 0 0 0.92 0.92h3.76a0.92 0.92 0 0 0 0.92-0.92V5.2"/>
    <!-- foam: the same three lobes as the logo -->
    <path d="M0.9 5.2C0.9 4.12 1.94 3.72 2.62 4.36 2.98 3.24 4.42 3.24 4.78 4.36 5.46 3.72 6.5 4.12 6.5 5.2Z"/>
  </g>
  <!-- sparkle, filled: a stroked star closes up at this size -->
  <path d="M10.7 1.4l0.42 1.0 1.0 0.42-1.0 0.42-0.42 1.0-0.42-1.0-1.0-0.42 1.0-0.42z" fill="#6E6E6E"/>
</svg>
