<svg width="13" height="13" viewBox="0 0 13 13" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    A scale reduction of META-INF/pluginIcon.svg, not a separate drawing: same glass
    proportions, same three-lobe foam, same handle on the right. The bubbles are dropped
    because at 13px they close up into noise — the silhouette is what identifies the mark
    at this size.
  -->
  <g stroke="#6E6E6E" stroke-width="1.1" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- handle -->
    <path d="M8.8 5.9h0.9a1.5 1.5 0 0 1 0 3.1H8.8"/>
    <!-- glass: sides and rounded base; the rim is formed by the foam -->
    <path d="M1.8 3.9V10a1.15 1.15 0 0 0 1.15 1.15h4.7A1.15 1.15 0 0 0 8.8 10V3.9"/>
    <!-- foam: three lobes, the middle one highest -->
    <path d="M1.8 3.9C1.8 2.55 3.1 2.05 3.95 2.85 4.4 1.45 6.2 1.45 6.65 2.85 7.5 2.05 8.8 2.55 8.8 3.9Z"/>
  </g>
</svg>
