# Opt-out of the build logic that might fail on some Windows configurations
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# The IntelliJ Platform ships its own Kotlin stdlib; adding ours as well risks a version
# clash at runtime. See https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency=false

# ---- Plugin coordinates -------------------------------------------------
# NOTE: pluginId is intentionally unchanged from the original release so the
# rebrand ships as an UPDATE to the existing Marketplace listing rather than a
# brand-new one (a new id would orphan the current downloads and reviews).
pluginId = com.plugin.springprops.viewer
pluginName = DevBeer
pluginVersion = 2.4.0

# ---- Target platform ----------------------------------------------------
# Bump platformVersion + pluginUntilBuild together to support newer IDEs, then
# re-run `gradlew verifyPlugin` before uploading.
#
# The floor of 231 was measured, not guessed. Verifying against the whole 2021–2024 range
# gives (see docs/COMPATIBILITY.md for the full table):
#
#   2021.3, 2022.1   20 problems   ActionUpdateThread + ContentFactory missing
#   2022.2, 2022.3    2 problems   declarative inlay hints missing (Spring module only)
#   2023.1 onward     Compatible
#
# An earlier comment here claimed 233 was a hard floor because of the declarative inlay-hints
# API. That was wrong: those classes arrived in 2023.1, not 2023.3, and 231/232 verify clean.
#
# Reaching 2022.2 would additionally require dropping or rewriting the Spring inlay hints —
# they are the *only* thing that breaks there. Everything else, including the whole AI layer,
# already works on 2022.2.
platformVersion = 2024.1.4
pluginSinceBuild = 231
pluginUntilBuild = 243.*
