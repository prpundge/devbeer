# Opt-out of the build logic that might fail on some Windows configurations
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# The IntelliJ Platform ships its own Kotlin stdlib; adding ours as well risks a version
# clash at runtime. See https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency=false

# ---- Plugin coordinates -------------------------------------------------
# NOTE: pluginId is intentionally unchanged from the original release so the
# rebrand ships as an UPDATE to the existing Marketplace listing rather than a
# brand-new one (a new id would orphan the current downloads and reviews).
pluginId = com.plugin.springprops.viewer
pluginName = DevBeer
pluginVersion = 2.2.0

# ---- Target platform ----------------------------------------------------
# Bump platformVersion + pluginUntilBuild together to support newer IDEs, then
# re-run `gradlew verifyPlugin` before uploading.
#
# 233 (2023.3) is a hard floor, not a preference. The Spring inlay hints use the
# declarative inlay-hints API (codeInsight.declarativeInlayProvider), which JetBrains
# introduced in 2023.3 — it does not exist in any 2020/2021/2022 build. Lowering this
# number would let the plugin install on IDEs where it then fails to load. Reaching
# further back means rewriting the hints against the pre-declarative API and replacing
# ContentFactory.getInstance() (2022.3) and Service.Level (2021.3); 2020.x additionally
# requires abandoning the IntelliJ Platform Gradle Plugin 2.x, whose own floor is 2022.3.
platformVersion = 2024.1.4
pluginSinceBuild = 233
pluginUntilBuild = 243.*
